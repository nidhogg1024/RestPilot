name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          sw_vers
          swift --version

      - name: 运行测试
        run: swift test

      - name: 构建本地应用包
        run: zsh scripts/build-app.sh
